[package]
name = "lost-scores-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lost-scores-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control", "image-data"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
rayon = "1.12.0"
jiff = "0.2.43"
lost-scores-app = { path = "../lost-scores-app" }
lost-scores-core = { path = "../lost-scores-core" }
open = "5.4.5"
osu-api = { path = "../osu-api" }
rfd = "0.18.0"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "accessibility"] }
ureq = "3.5.2"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1.34"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
tempfile = "3.27.0"
