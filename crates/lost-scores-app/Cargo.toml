[package]
name = "lost-scores-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
lost-scores-core = { path = "../lost-scores-core" }
osu-formats = { path = "../osu-formats" }
osu-api = { path = "../osu-api" }
serde = { version = "1.0.229", features = ["derive"] }
