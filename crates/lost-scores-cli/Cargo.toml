[package]
name = "lost-scores-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
lost-scores-core = { path = "../lost-scores-core" }
osu-api = { path = "../osu-api" }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
osu-formats = { path = "../osu-formats" }
tempfile = "3.27.0"

[[bin]]
name = "lost-scores"
path = "src/main.rs"
